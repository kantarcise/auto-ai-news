name: Daily AI News Report

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    # Keep publication stable when ubuntu-latest changes its underlying image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate report
        id: generate
        run: |
          mkdir -p "$RUNNER_TEMP/ranking-evaluation"
          python scripts/generate_report.py \
            --output "$RUNNER_TEMP/daily-ai-news.md" \
            --evaluation-output "$RUNNER_TEMP/ranking-evaluation/candidates.json" \
            --evaluation-excerpts

      - name: Compare ranking proposals
        continue-on-error: true
        run: |
          python -m scripts.compare_rankings \
            "$RUNNER_TEMP/ranking-evaluation/candidates.json" \
            --output "$RUNNER_TEMP/ranking-evaluation/comparison.md" \
            --json-output "$RUNNER_TEMP/ranking-evaluation/comparison.json" \
            --revision "$GITHUB_SHA"

      - name: Save ranking evaluation
        if: always() && steps.generate.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ranking-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ranking-evaluation/
          retention-days: 30
          if-no-files-found: error

      - name: Publish daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_date="$(date -u +%F)"
          tag="daily-${report_date}"
          title="Daily AI News - ${report_date}"
          notes_file="$RUNNER_TEMP/daily-ai-news.md"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file "$notes_file" \
              --latest
          else
            gh release create "$tag" \
              --title "$title" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA" \
              --latest
          fi
